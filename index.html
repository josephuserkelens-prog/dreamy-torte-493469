<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Creaplay CRM</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
  #login-screen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100vh; background: #222;
  }
  #login-box {
    background: white; padding: 30px; border-radius: 8px; width: 300px;
  }
  #login-box input {
    width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box;
  }
  #login-box button {
    width: 100%; padding: 10px; background: #007bff; color: white;
    border: none; border-radius: 4px; cursor: pointer;
  }
  #error-msg { color: red; font-size: 14px; }
  #app { display: none; padding: 20px; }
  #topbar {
    display: flex; justify-content: space-between; align-items: center;
    background: #333; color: white; padding: 10px 20px;
  }
  #logout-btn {
    background: #dc3545; color: white; border: none; padding: 8px 14px;
    border-radius: 4px; cursor: pointer;
  }
  nav button {
    margin: 10px 5px 20px 0; padding: 8px 14px; cursor: pointer;
    border: none; border-radius: 4px; background: #007bff; color: white;
  }
  .page { display: none; }
  .page.active { display: block; }
  #status-box, .form-box, .list-box {
    margin-top: 10px; padding: 15px; background: white; border-radius: 6px;
    max-width: 500px;
  }
  .form-box label { display: block; margin-top: 10px; font-weight: bold; }
  .form-box input, .form-box select {
    width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;
  }
  .form-box button {
    margin-top: 15px; padding: 10px 20px; background: #28a745; color: white;
    border: none; border-radius: 4px; cursor: pointer;
  }
  .company-item {
    border-bottom: 1px solid #ddd; padding: 10px 0;
  }
  .companies-header {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 500px;
  }
  .add-new-btn {
    background: #6f42c1; color: white; border: none; padding: 8px 14px;
    border-radius: 4px; cursor: pointer;
  }
  .new-contact-box {
    margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 4px;
    border: 1px solid #ddd;
  }
  .new-contact-box button {
    margin-top: 10px; padding: 8px 14px; background: #17a2b8; color: white;
    border: none; border-radius: 4px; cursor: pointer;
  }
  .contact-chip {
    display: flex; justify-content: space-between; align-items: center;
    background: #eef; padding: 6px 10px; border-radius: 4px; margin-top: 6px;
    font-size: 14px;
  }
  .contact-chip button {
    background: #dc3545; color: white; border: none; border-radius: 3px;
    padding: 2px 8px; cursor: pointer;
  }
  .company-contacts {
    margin-top: 6px; font-size: 13px; color: #555;
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div id="login-box">
    <h2>🔐 Creaplay CRM Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="error-msg"></p>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div id="topbar">
    <h2>📊 Creaplay CRM</h2>
    <div>
      <span id="user-email"></span>
      <button id="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <nav>
    <button onclick="showPage('dashboard')">🏠 Dashboard</button>
    <button onclick="showPage('companies')">🏢 Companies</button>
  </nav>

  <!-- DASHBOARD PAGE -->
  <div id="dashboard" class="page active">
    <div id="status-box">
      <h3>✅ Connection Status</h3>
      <p id="firestore-status">Checking Firestore connection...</p>
    </div>
  </div>

  <!-- COMPANIES PAGE -->
  <div id="companies" class="page">

    <div class="companies-header">
      <h3>🏢 Companies</h3>
      <button class="add-new-btn" onclick="toggleCompanyForm()">+ Add New Company</button>
    </div>

    <div class="list-box">
      <div id="companies-list">Loading...</div>
    </div>

    <div class="form-box" id="company-form-box" style="display:none;">
      <h3>➕ Add New Company</h3>

      <label>Company Name</label>
      <input type="text" id="c-name">

      <label>Street</label>
      <input type="text" id="c-street">

      <label>Zip Code</label>
      <input type="text" id="c-zip">

      <label>Place / City</label>
      <input type="text" id="c-place">

      <label>Country</label>
      <select id="c-country">
        <option>Belgium</option>
        <option>Netherlands</option>
        <option>Germany</option>
        <option>France</option>
        <option>United Kingdom</option>
        <option>United States</option>
        <option>Spain</option>
        <option>Italy</option>
        <option>Other</option>
      </select>

      <label>Email</label>
      <input type="email" id="c-email">

      <label>Type</label>
      <select id="c-type">
        <option>Reseller</option>
        <option>Partner</option>
        <option>Supplier</option>
        <option>End User</option>
        <option>Other</option>
      </select>

      <label>VAT Number</label>
      <input type="text" id="c-vat">

      <label>Contact Persons</label>
      <select id="c-contact-list" onchange="onContactSelect()">
        <option value="">-- Select Existing or Add New --</option>
        <option value="__new__">➕ Add New Contact</option>
      </select>

      <div class="new-contact-box" id="new-contact-fields" style="display:none;">
        <label>Name</label>
        <input type="text" id="nc-name">

        <label>Role</label>
        <input type="text" id="nc-role">

        <label>Email</label>
        <input type="email" id="nc-email">

        <label>Phone</label>
        <input type="text" id="nc-phone">

        <button type="button" onclick="addContactToCompany()">➕ Add Contact</button>
      </div>

      <div id="company-contacts-list"></div>

      <button onclick="saveCompany()">💾 Save Company</button>
      <p id="company-msg"></p>
    </div>

  </div>

</div>

<!-- FIREBASE SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, getDocs, addDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB7Z2wEFYzjqEZHEXTog4VVGKchTp-UyKU",
    authDomain: "creaplay-production.firebaseapp.com",
    projectId: "creaplay-production",
    storageBucket: "creaplay-production.firebasestorage.app",
    messagingSenderId: "149172973252",
    appId: "1:149172973252:web:1744ebd5a0b3ea8cb06391"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ---------- LOGIN ----------
  window.login = function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const errorMsg = document.getElementById("error-msg");
    errorMsg.textContent = "";

    signInWithEmailAndPassword(auth, email, password)
      .catch((error) => {
        errorMsg.textContent = "❌ " + error.message;
      });
  };

  window.logout = function() {
    signOut(auth);
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("app").style.display = "block";
      document.getElementById("user-email").textContent = "👤 " + user.email;
      testFirestore();
      loadCompanies();
    } else {
      document.getElementById("login-screen").style.display = "flex";
      document.getElementById("app").style.display = "none";
    }
  });

  async function testFirestore() {
    const statusEl = document.getElementById("firestore-status");
    try {
      await getDocs(collection(db, "test"));
      statusEl.textContent = "✅ Firestore connected successfully!";
    } catch (e) {
      statusEl.textContent = "⚠️ Firestore error: " + e.message;
    }
  }

  // ---------- NAVIGATION ----------
  window.showPage = function(pageId) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(pageId).classList.add("active");
  };

  // ---------- COMPANY FORM TOGGLE ----------
  window.toggleCompanyForm = function() {
    const box = document.getElementById("company-form-box");
    if (box.style.display === "none" || box.style.display === "") {
      box.style.display = "block";
      resetCompanyForm();
    } else {
      box.style.display = "none";
    }
  };

  function resetCompanyForm() {
    document.getElementById("c-name").value = "";
    document.getElementById("c-street").value = "";
    document.getElementById("c-zip").value = "";
    document.getElementById("c-place").value = "";
    document.getElementById("c-email").value = "";
    document.getElementById("c-vat").value = "";
    document.getElementById("c-contact-list").value = "";
    document.getElementById("new-contact-fields").style.display = "none";
    document.getElementById("company-msg").textContent = "";
    currentCompanyContacts = [];
    renderCompanyContactsList();
  }

  // ---------- CONTACT PERSON COMBOBOX ----------
  let allContactsCache = [];       // aggregated list of every contact ever created (for dropdown)
  let currentCompanyContacts = []; // contacts being added to the company currently in the form

  window.onContactSelect = function() {
    const select = document.getElementById("c-contact-list");
    const value = select.value;
    const fieldsBox = document.getElementById("new-contact-fields");

    if (value === "__new__") {
      fieldsBox.style.display = "block";
      document.getElementById("nc-name").value = "";
      document.getElementById("nc-role").value = "";
      document.getElementById("nc-email").value = "";
      document.getElementById("nc-phone").value = "";
    } else if (value !== "") {
      // existing contact selected -> prefill fields for confirmation
      const contact = allContactsCache[parseInt(value)];
      if (contact) {
        fieldsBox.style.display = "block";
        document.getElementById("nc-name").value = contact.name || "";
        document.getElementById("nc-role").value = contact.role || "";
        document.getElementById("nc-email").value = contact.email || "";
        document.getElementById("nc-phone").value = contact.phone || "";
      }
    } else {
      fieldsBox.style.display = "none";
    }
  };

  window.addContactToCompany = function() {
    const name = document.getElementById("nc-name").value.trim();
    const role = document.getElementById("nc-role").value.trim();
    const email = document.getElementById("nc-email").value.trim();
    const phone = document.getElementById("nc-phone").value.trim();

    if (!name) {
      alert("Contact name is required.");
      return;
    }

    currentCompanyContacts.push({ name, role, email, phone });
    renderCompanyContactsList();

    // reset fields
    document.getElementById("nc-name").value = "";
    document.getElementById("nc-role").value = "";
    document.getElementById("nc-email").value = "";
    document.getElementById("nc-phone").value = "";
    document.getElementById("new-contact-fields").style.display = "none";
    document.getElementById("c-contact-list").value = "";
  };

  window.removeCompanyContact = function(index) {
    currentCompanyContacts.splice(index, 1);
    renderCompanyContactsList();
  };

  function renderCompanyContactsList() {
    const box = document.getElementById("company-contacts-list");
    box.innerHTML = "";
    currentCompanyContacts.forEach((c, i) => {
      const div = document.createElement("div");
      div.className = "contact-chip";
      div.innerHTML = `
        <span>👤 ${c.name}${c.role ? " (" + c.role + ")" : ""}${c.email ? " – " + c.email : ""}</span>
        <button onclick="removeCompanyContact(${i})">✕</button>
      `;
      box.appendChild(div);
    });
  }

  function populateContactDropdown() {
    const select = document.getElementById("c-contact-list");
    // keep first two options (placeholder + "add new")
    select.innerHTML = `
      <option value="">-- Select Existing or Add New --</option>
      <option value="__new__">➕ Add New Contact</option>
    `;
    allContactsCache.forEach((c, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = `${c.name}${c.companyName ? " (" + c.companyName + ")" : ""}`;
      select.appendChild(opt);
    });
  }

  // ---------- SAVE COMPANY ----------
  window.saveCompany = function() {
    const name = document.getElementById("c-name").value.trim();
    const msg = document.getElementById("company-msg");
    msg.textContent = "";

    if (!name) {
      msg.textContent = "⚠️ Company name is required.";
      return;
    }

    const companyData = {
      name: name,
      street: document.getElementById("c-street").value.trim(),
      zip: document.getElementById("c-zip").value.trim(),
      place: document.getElementById("c-place").value.trim(),
      country: document.getElementById("c-country").value,
      email: document.getElementById("c-email").value.trim(),
      type: document.getElementById("c-type").value,
      vat: document.getElementById("c-vat").value.trim(),
      contacts: currentCompanyContacts,
      createdAt: serverTimestamp()
    };

    addDoc(collection(db, "companies"), companyData)
      .then(() => {
        msg.textContent = "✅ Company saved!";
        resetCompanyForm();
        document.getElementById("company-form-box").style.display = "none";
        loadCompanies();
      })
      .catch((error) => {
        msg.textContent = "❌ Error: " + error.message;
      });
  };

  // ---------- LOAD COMPANIES ----------
  async function loadCompanies() {
    const listEl = document.getElementById("companies-list");
    listEl.innerHTML = "Loading...";

    try {
      const snapshot = await getDocs(collection(db, "companies"));

      if (snapshot.empty) {
        listEl.innerHTML = "No companies yet.";
        allContactsCache = [];
        populateContactDropdown();
        return;
      }

      let html = "";
      allContactsCache = [];

      snapshot.forEach((doc) => {
        const c = doc.data();
        html += `<div class="company-item">
          <strong>${c.name || ""}</strong> (${c.type || ""})<br>
          ${c.street || ""}, ${c.zip || ""} ${c.place || ""}, ${c.country || ""}<br>
          📧 ${c.email || "-"} | VAT: ${c.vat || "-"}
        `;

        if (c.contacts && c.contacts.length > 0) {
          html += `<div class="company-contacts">👤 Contacts: `;
          html += c.contacts.map(ct => ct.name).join(", ");
          html += `</div>`;

          // add each contact to the global cache for the dropdown (tag with company name)
          c.contacts.forEach(ct => {
            allContactsCache.push({ ...ct, companyName: c.name });
          });
        }

        html += `</div>`;
      });

      listEl.innerHTML = html;
      populateContactDropdown();

    } catch (e) {
      listEl.innerHTML = "⚠️ Error loading companies: " + e.message;
    }
  }
</script>

</body>
</html>
